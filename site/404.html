<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found - Eric Patton</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0b0f" />

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <link rel="stylesheet" href="/design-system/tokens.css" />
    <link rel="stylesheet" href="/design-system/base.css" />
    <link rel="stylesheet" href="/design-system/components.css" />

    <script>
      // Runs before first paint: a saved choice has to be on <html> before the body renders, or
      // the page flashes the system theme first. Wrapped because storage throws in some contexts.
      (function () {
        try {
          var saved = localStorage.getItem('ep-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-ep-theme', saved);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: var(--ep-space-lg);
        text-align: center;
        background:
          radial-gradient(90% 60% at 50% 0%, rgba(255, 169, 77, 0.08), transparent 70%),
          var(--ep-bg);
      }

      h1 {
        margin-top: var(--ep-space-xs);
        font-size: var(--ep-text-title);
        letter-spacing: var(--ep-tracking-display);
      }

      p {
        max-width: 42ch;
        margin: var(--ep-space-sm) auto 0;
        color: var(--ep-ink-2);
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: var(--ep-space-lg);
      }
    </style>
  </head>

  <body>
    <main>
      <span class="ep-mono ep-mono--accent">Error 404</span>
      <h1 class="ep-title">That page is not here.</h1>
      <p>
        It may have been renamed, or it may never have existed. The front page has everything
        anyway; there are not that many pages.
      </p>
      <div class="actions">
        <a class="ep-btn ep-btn--primary" href="/">Back to the front page</a>
      </div>
    </main>
  </body>
</html>
