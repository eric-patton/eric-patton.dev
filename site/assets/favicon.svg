<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eric Patton">
  <!--
    The wordmark reduced to its two rules and a stem: an editorial "E" built from the same
    hairline rules the site uses to separate sections, on the warm paper ground.
  -->
  <rect width="32" height="32" rx="6" fill="#1c3a5b" />
  <g fill="#faf8f4">
    <rect x="8" y="8" width="3" height="16" />
    <rect x="8" y="8" width="15" height="3" />
    <rect x="8" y="14.5" width="11" height="3" />
    <rect x="8" y="21" width="15" height="3" />
  </g>
</svg>
