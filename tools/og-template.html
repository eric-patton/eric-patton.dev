<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Graph card source</title>
    <!--
      Not shipped. tools/make-og.mjs renders this at exactly 1200x630 and writes
      site/assets/og.png, which is what link unfurls show.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../design-system/base.css" />
    <style>
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        position: relative;
        overflow: hidden;
        background: var(--ep-bg);
      }

      .art {
        position: absolute;
        inset: 0;
        background-image: url("../site/assets/gen/hero.jpg");
        background-size: cover;
        background-position: 50% 45%;
        opacity: 0.55;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(115% 90% at 10% 20%, rgba(10, 11, 15, 0.1) 0%, rgba(10, 11, 15, 0.88) 58%, var(--ep-bg) 100%),
          linear-gradient(to bottom, rgba(10, 11, 15, 0.35), rgba(10, 11, 15, 0.9));
      }

      .inner {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .glyph {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(140deg, var(--ep-accent), var(--ep-accent-hot) 55%, var(--ep-accent-deep));
        box-shadow: 0 0 0 1px rgba(255, 169, 77, 0.35), 0 8px 22px -6px rgba(255, 138, 61, 0.8);
      }

      h1 {
        margin: 26px 0 0;
        font-family: var(--ep-font-display);
        font-size: 78px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.035em;
        max-width: 17ch;
      }

      footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--ep-line);
      }

      .who {
        font-family: var(--ep-font-display);
        font-size: 27px;
        font-weight: 600;
      }

      .domain {
        font-family: var(--ep-font-mono);
        font-size: 16px;
        color: var(--ep-ink-3);
        margin-top: 6px;
      }

      .meta {
        text-align: right;
        font-family: var(--ep-font-mono);
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ep-accent);
        line-height: 1.8;
      }
    </style>
  </head>

  <body>
    <div class="art"></div>
    <div class="scrim"></div>

    <div class="inner">
      <div>
        <div class="glyph"></div>
        <h1>I build the tooling agents run on, and <span class="ep-gradient">I fix what they break.</span></h1>
      </div>

      <footer>
        <div>
          <div class="who">Eric Patton</div>
          <div class="domain">eric-patton.dev</div>
        </div>
        <div class="meta">
          Principal software engineer<br />
          Fifteen years / New Orleans
        </div>
      </footer>
    </div>
  </body>
</html>
