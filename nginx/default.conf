# Static hosting for eric-patton.dev.
#
# The site is plain files, so there is no upstream and no templating: unlike the RequestDesk
# front end, nothing here has to resolve a sibling container at start-up.
#
# Requests arrive from the Cloudflare Tunnel on the same host, so the client address is in
# CF-Connecting-IP rather than in the socket. The map below keeps the access log honest.

map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

log_format tunnel '$client_ip - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    # The health check runs busybox wget inside the container, which resolves localhost to ::1
    # first. Without this line it gets a connection refused and the container reports unhealthy.
    listen [::]:80;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log tunnel;

    # Cloudflare already compresses on the edge, but the tunnel leg is local and gzip here keeps
    # the origin honest when the site is opened directly on the host.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Fingerprinted assets do not exist here yet, so the images and stylesheets get a short
    # cache with revalidation rather than a year. Changing a colour should not need a cache bust.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
